<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="Greenlight">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;display=swap');</style>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BEA95"/>
      <stop offset="1" stop-color="#12B257"/>
    </linearGradient>
    <radialGradient id="bgglow" cx="85%" cy="12%" r="70%">
      <stop offset="0" stop-color="#1f7d4d" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0d1311" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="756" height="236" rx="28" fill="#0d1311" stroke="#21302A" stroke-width="1.5"/>
  <rect x="2" y="2" width="756" height="236" rx="28" fill="url(#bgglow)"/>

  <!-- icon mark -->
  <g transform="translate(60,40) scale(0.8)">
    <circle cx="100" cy="100" r="40" fill="#2EE07A" opacity="0.30" filter="url(#soft)"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="#F2F0E9" stroke-width="7"/>
    <circle cx="100" cy="100" r="50" fill="none" stroke="#F2F0E9" stroke-width="2" opacity="0.22"/>
    <circle cx="100" cy="100" r="30" fill="url(#core)"/>
    <ellipse cx="90" cy="88" rx="13" ry="9" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- wordmark -->
  <text x="280" y="130" font-family="Sora, 'Hanken Grotesk', system-ui, sans-serif" font-size="70" font-weight="600" letter-spacing="-1.5" fill="#F2F0E9">Greenlight</text>
  <text x="283" y="170" font-family="Sora, 'Hanken Grotesk', system-ui, sans-serif" font-size="14.5" font-weight="500" letter-spacing="4.5" fill="#8FA39A">ALIGN BEFORE YOU BUILD</text>
</svg>
